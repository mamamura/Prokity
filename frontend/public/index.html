        <title>প্রকৃতির ঘ্রাণ · Organic Shop</title>
        <script>
            // Silence a specific benign perf DataCloneError that some browsers surface.
            window.addEventListener("error", function (e) {
                if (
                    e.error instanceof DOMException &&
                    e.error.name === "DataCloneError" &&
                    e.message &&
                    e.message.includes("PerformanceServerTiming")
                ) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            }, true);
        </script>
    </head>
    <body>
        <noscript>এই সাইটটি চালাতে JavaScript প্রয়োজন।</noscript>
        <div id="root"></div>
    </body>
</html>
